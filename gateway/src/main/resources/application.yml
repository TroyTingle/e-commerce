server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
                allowed-methods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS
                allowed-headers: '*'
                exposed-headers:
                  - Location
                allow-credentials: true

gateway:
  services:
    user-service-url: ${USER_SERVICE_URL:http://localhost:8081}
    product-service-url: ${PRODUCT_SERVICE_URL:http://localhost:8082}
    order-service-url: ${ORDER_SERVICE_URL:http://localhost:8083}
  rate-limit:
    requests: ${GATEWAY_RATE_LIMIT_REQUESTS:120}
    window: ${GATEWAY_RATE_LIMIT_WINDOW:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    uk.co.ttingle.gateway: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger - %msg%n"

security:
  jwt:
    secret: ${JWT_SECRET:your_very_secret_jwt_secret_key_32}
    expiration: 3600000
