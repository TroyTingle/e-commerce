openapi: 3.1.0
info:
  title: User Service API
  version: 1.0.0
paths:
  /api/v1/auth/login:
    get:
      tags:
      - Authentication
      operationId: login
      summary: Authenticate a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/LoginRequest"
      responses:
        '200':
          description: Authentication token
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/AuthResponse"
        '401':
          "$ref": "#/components/responses/Unauthorized"
        '500':
          "$ref": "#/components/responses/ServerError"
  /api/v1/auth/register:
    post:
      tags:
      - Authentication
      operationId: register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/RegisterRequest"
      responses:
        '201':
          description: Registered user
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/UserDto"
        '409':
          "$ref": "#/components/responses/Conflict"
        '500':
          "$ref": "#/components/responses/ServerError"
components:
  schemas:
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - firstName
      - lastName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 100
        firstName:
          type: string
          minLength: 2
          maxLength: 50
        lastName:
          type: string
          minLength: 2
          maxLength: 100
    AuthResponse:
      type: object
      properties:
        token:
          type: string
        type:
          type: string
    UserDto:
      type: object
      properties:
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
    ExceptionDto:
      type: object
      properties:
        message:
          type: string
        validationErrors:
          type: object
          additionalProperties:
            type: string
  responses:
    Unauthorized:
      description: Invalid credentials
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ExceptionDto"
    Conflict:
      description: Email already registered
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ExceptionDto"
    ServerError:
      description: Unexpected error
      content:
        application/json:
          schema:
            "$ref": "#/components/schemas/ExceptionDto"
